plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}

group = 'com.example'
version = '2.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    // Excel bảng lương / bảng công
    implementation 'org.apache.poi:poi-ooxml:5.2.5'
    // Gọi API máy chấm công Hikvision (Digest auth)
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'

    runtimeOnly 'com.mysql:mysql-connector-j'
    // Thưởng từ Cyber ERP (SQL Server) - chỉ dùng khi bật payroll.erp.enabled=true
    runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Dự án có 2 lớp @SpringBootApplication (HrmServiceApplication và service/HrmApplication cũ):
// chỉ định lớp chạy chính để bootJar / bootRun không báo "Unable to find a single main class".
springBoot {
    mainClass = 'com.example.hrm.HrmServiceApplication'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-parameters'
}

tasks.named('test') {
    useJUnitPlatform()
}
