## =====================================================================
##  MODULE LƯƠNG - chép các dòng cần dùng vào src/main/resources/application.properties
##  (dòng nào không khai báo thì dùng giá trị mặc định ghi bên dưới)
## =====================================================================
#
## Tên công ty in trên file Excel bảng lương
#payroll.company-name=Thanh Hóa Ford
#
## ---------- Phân quyền các trang quản trị lương ----------
## false = tắt kiểm tra (khi đã phân quyền bằng Spring Security)
#payroll.security.enabled=true
## role được vào (so với users.role và role của Spring Security)
#payroll.admin.roles=ADMIN,ROLE_ADMIN,HR,ROLE_HR,KETOAN,ROLE_KETOAN,ACCOUNTANT,ROLE_ACCOUNTANT
## phòng ban được vào (tên phòng CHỨA chuỗi này, không phân biệt dấu / hoa thường)
#payroll.admin.departments=ke toan,nhan su
#payroll.security.login-url=/login
#payroll.security.denied-url=/?error=no-permission
#
## ---------- Quy đổi yêu cầu XÁC NHẬN CÔNG đã duyệt -> số công ----------
## (trạng thái confirmStatus = số công; phép / nghỉ không lương theo buổi sáng/chiều tự tính nửa ngày)
#payroll.confirm.values=PRESENT=1,HALF_DAY=0.5,ANNUAL_LEAVE=1,UNPAID_LEAVE=0
#
## ---------- Phiếu tạm tính tự lưu hằng ngày (mặc định TẮT) ----------
#payroll.auto.enabled=false
#payroll.auto.cron=0 15 12,23 * * *
#payroll.auto.prev-month-days=5
#
## ---------- Thưởng từ SQL Server (Cyber ERP) - mặc định TẮT ----------
## build.gradle: runtimeOnly 'com.microsoft.sqlserver:mssql-jdbc'
#payroll.erp.enabled=false
#payroll.erp.url=jdbc:sqlserver://10.0.0.5:1433;databaseName=CYBER;encrypt=false
#payroll.erp.username=hrm_read
#payroll.erp.password=
## 1 = SQL trả về ĐỒNG ; 1000 = trả về NGHÌN ĐỒNG
#payroll.erp.amount-unit=1
#payroll.erp.cache-minutes=10
#
## Mỗi loại thưởng 1 câu SQL (bỏ dấu # để dùng). Tham số: :year :month :from :to
## Kết quả 2 cột: mã NV (khớp users.employee_no hoặc salary_code), số tiền.
## Loại không khai báo -> nhập tay ở trang "Khoản theo tháng".
##payroll.erp.sql.THUONG_CHINH_SACH=SELECT ma_nv, SUM(so_tien) FROM dbo.v_ThuongChinhSach WHERE nam = :year AND thang = :month GROUP BY ma_nv
##payroll.erp.sql.THUONG_DICH_VU=EXEC dbo.usp_ThuongDichVu @Nam = :year, @Thang = :month
##payroll.erp.sql.THUONG_TVBH=SELECT ma_nv, so_tien FROM dbo.v_ThuongTVBH WHERE ngay BETWEEN :from AND :to
