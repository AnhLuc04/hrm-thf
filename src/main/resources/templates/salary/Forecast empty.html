<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phiếu lương dự kiến</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 720px">
  <h4 th:text="'Phiếu lương dự kiến tháng ' + ${month} + '/' + ${year}">Phiếu lương dự kiến</h4>
  <p class="text-muted" th:text="${calc.user.employeeNo} + ' - ' + ${calc.user.fullName}"></p>

  <div class="alert alert-warning">
    <b>Chưa tính được phiếu lương dự kiến.</b>
    <div th:if="${!forHr}" class="mt-1">
      Hồ sơ lương của bạn chưa được thiết lập đầy đủ (mẫu công thức, lương cơ bản) hoặc tháng này chưa có dữ liệu chấm công.
      Vui lòng liên hệ phòng Kế toán / Nhân sự.
    </div>
    <div th:if="${forHr}" class="mt-1 small" style="font-family: monospace" th:text="${calc.error}"></div>
  </div>

  <div class="d-flex gap-2">
    <a class="btn btn-outline-secondary" th:href="@{/payroll/my}">Phiếu lương của tôi</a>
    <a th:if="${forHr}" class="btn btn-outline-primary" th:href="@{/salary-config/edit(userId=${calc.user.id})}">Cấu hình lương NV này</a>
    <a th:if="${forHr}" class="btn btn-outline-primary"
       th:href="@{/payroll/auto-calculate/trace(userId=${calc.user.id}, month=${month}, year=${year})}">Giải trình</a>
  </div>
</div>
</body>
</html>
