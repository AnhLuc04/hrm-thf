<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">

<!-- ===== <head> dùng chung: th:replace="~{salary/fragments :: head('Tiêu đề')}" ===== -->
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title th:text="${title} + ' | Lương'">Lương</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MENU CHUNG (giống mọi trang) -->
    <th:block th:replace="~{fragments/shell :: styles}"></th:block>
    <style>
        /* ================= GIAO DIỆN LƯƠNG (đồng bộ HRM, đè lên Bootstrap, không đổi chức năng) ================= */
        :root {
            --s-bg: #f6f7fb; --s-panel: #fff; --s-ink: #0b1220; --s-ink2: #344054; --s-muted: #667085; --s-faint: #98a2b3;
            --s-line: #eaecf0; --s-line2: #d0d5dd; --s-brand: #4f46e5; --s-brand-600: #4338ca; --s-brand-50: #eef2ff;
            --s-ok: #067647; --s-ok-50: #ecfdf3; --s-warn: #b54708; --s-warn-50: #fffaeb; --s-err: #b42318; --s-err-50: #fef3f2;
            --bs-body-font-family: "Inter", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
            --bs-body-font-size: .875rem; --bs-body-color: #344054; --bs-body-bg: #f6f7fb;
            --bs-primary: #4f46e5; --bs-primary-rgb: 79, 70, 229; --bs-link-color: #4338ca; --bs-link-color-rgb: 67, 56, 202;
            --bs-border-color: #eaecf0; --bs-border-radius: .55rem; --bs-border-radius-sm: .45rem; --bs-border-radius-lg: .8rem;
        }
        /* chừa chỗ cho menu trái chung; dưới 1180px menu thành ngăn kéo như các trang khác */
        body { padding-left: var(--sh-side); background: var(--s-bg); font-family: var(--bs-body-font-family); -webkit-font-smoothing: antialiased; }
        @media (max-width: 1179px) { body { padding-left: 0; } }
        @media print { body { padding-left: 0 !important; background: #fff; } .sal-tabs, .sal-bar { display: none !important; } }
        a { text-decoration: none; }
        .container-fluid.pb-5, body > .container-fluid, body > .container { padding: 6px 28px 48px; max-width: 1600px; }
        @media (max-width: 720px) { .container-fluid.pb-5, body > .container-fluid, body > .container { padding: 4px 14px 40px; } }

        /* tiêu đề trang */
        h4 { font-size: 1.35rem; font-weight: 700; color: var(--s-ink); letter-spacing: -.01em; margin: 10px 0 14px; }
        h5, h6 { color: var(--s-ink); font-weight: 650; }
        .text-muted { color: var(--s-muted) !important; }

        /* thanh bước 1-4 */
        .sal-tabs { background: #fff; border-bottom: 1px solid var(--s-line); position: sticky; top: 0; z-index: 30; }
        @media (max-width: 1179px) { .sal-tabs { top: calc(56px + env(safe-area-inset-top, 0px)); } }
        .sal-tabs .container-fluid { padding: 0 20px; gap: 8px; max-width: none; }
        .sal-tabs .navbar-nav { gap: 2px; overflow-x: auto; flex-wrap: nowrap !important; scrollbar-width: none; }
        .sal-tabs .nav-link { display: flex; align-items: center; gap: 8px; color: var(--s-muted); font-weight: 500; font-size: .86rem; white-space: nowrap;
                              padding: 14px 12px !important; border-bottom: 2px solid transparent; border-radius: 0; }
        .sal-tabs .nav-link .st { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: .72rem; font-weight: 700;
                                  background: #f2f4f7; color: var(--s-muted); border: 1px solid var(--s-line2); }
        .sal-tabs .nav-link.active { color: var(--s-brand-600); border-bottom-color: var(--s-brand); font-weight: 600; }
        .sal-tabs .nav-link.active .st { background: var(--s-brand); color: #fff; border-color: var(--s-brand); }
        .sal-tabs .nav-link:hover { color: var(--s-ink); }
        .sal-tabs .unit { font-size: .78rem; font-weight: 600; color: var(--s-brand-600); background: var(--s-brand-50); border: 1px solid #e0e7ff;
                          border-radius: 999px; padding: 3px 10px; white-space: nowrap; }

        /* thẻ */
        .card { border: 1px solid var(--s-line); border-radius: 14px; box-shadow: 0 1px 2px rgba(16, 24, 40, .04); overflow: hidden; }
        .card-header { background: #fff; border-bottom: 1px solid var(--s-line); padding: .8rem 1rem; color: var(--s-ink); font-weight: 600; }
        .card-body { padding: 1rem 1.1rem; }

        /* bảng */
        .table { --bs-table-bg: #fff; --bs-table-striped-bg: #fafbfc; --bs-table-hover-bg: #f5f7ff; --bs-table-border-color: #f0f1f4; margin-bottom: 0; }
        .table > thead th, .table thead.table-light th { background: #f9fafb !important; color: var(--s-muted); font-size: .74rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: .03em; border-bottom: 1px solid var(--s-line) !important; padding: .65rem .6rem; white-space: nowrap; vertical-align: bottom; }
        .table > tbody td { padding: .55rem .6rem; color: var(--s-ink2); }
        .table > tfoot th, .table tfoot.table-light th { background: #f9fafb !important; color: var(--s-ink); font-weight: 700; padding: .7rem .6rem; border-top: 1px solid var(--s-line); }
        .table-responsive { border-radius: 14px; }
        .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
        .table-sm td, .table-sm th { vertical-align: middle; }

        /* nút */
        .btn { font-weight: 600; border-radius: 9px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
        .btn-sm { font-size: .8rem; padding: .32rem .7rem; border-radius: 8px; }
        .btn-primary { --bs-btn-bg: #4f46e5; --bs-btn-border-color: #4f46e5; --bs-btn-hover-bg: #4338ca; --bs-btn-hover-border-color: #4338ca;
                       --bs-btn-active-bg: #3730a3; --bs-btn-active-border-color: #3730a3; --bs-btn-disabled-bg: #a5b4fc; --bs-btn-disabled-border-color: #a5b4fc; }
        .btn-outline-primary { --bs-btn-color: #4338ca; --bs-btn-border-color: #c7d2fe; --bs-btn-hover-bg: #eef2ff; --bs-btn-hover-color: #3730a3;
                               --bs-btn-hover-border-color: #a5b4fc; --bs-btn-active-bg: #e0e7ff; --bs-btn-active-color: #3730a3; }
        .btn-outline-secondary, .btn-light { --bs-btn-color: #344054; --bs-btn-bg: #fff; --bs-btn-border-color: #d0d5dd; --bs-btn-hover-bg: #f9fafb;
                               --bs-btn-hover-color: #0b1220; --bs-btn-hover-border-color: #d0d5dd; --bs-btn-active-bg: #f2f4f7; --bs-btn-active-color: #0b1220; }
        .btn-success { --bs-btn-bg: #079455; --bs-btn-border-color: #079455; --bs-btn-hover-bg: #067647; --bs-btn-hover-border-color: #067647; }
        .btn-outline-success { --bs-btn-color: #067647; --bs-btn-border-color: #abefc6; --bs-btn-hover-bg: #ecfdf3; --bs-btn-hover-color: #054f31; --bs-btn-hover-border-color: #75e0a7; }
        .btn-outline-danger { --bs-btn-color: #b42318; --bs-btn-border-color: #fecdca; --bs-btn-hover-bg: #fef3f2; --bs-btn-hover-color: #912018; --bs-btn-hover-border-color: #fda29b; }
        .btn-outline-dark { --bs-btn-color: #0b1220; --bs-btn-border-color: #98a2b3; --bs-btn-hover-bg: #0b1220; --bs-btn-hover-border-color: #0b1220; }
        .btn-link { font-weight: 600; color: var(--s-brand-600); }

        /* ô nhập */
        .form-control, .form-select { border-color: var(--s-line2); border-radius: 9px; color: var(--s-ink); }
        .form-control-sm, .form-select-sm { border-radius: 8px; min-height: 34px; }
        .form-control:focus, .form-select:focus { border-color: #a5b4fc; box-shadow: 0 0 0 3px rgba(79, 70, 229, .15); }
        .form-label { font-weight: 600; color: var(--s-ink2); font-size: .78rem; }
        .form-check-input:checked { background-color: var(--s-brand); border-color: var(--s-brand); }

        /* nhãn, thông báo */
        .badge { font-weight: 600; border-radius: 999px; padding: .35em .7em; }
        .text-bg-success { background: var(--s-ok-50) !important; color: var(--s-ok) !important; border: 1px solid #abefc6; }
        .text-bg-danger { background: var(--s-err-50) !important; color: var(--s-err) !important; border: 1px solid #fecdca; }
        .text-bg-secondary { background: #f2f4f7 !important; color: var(--s-muted) !important; border: 1px solid var(--s-line); }
        .text-bg-warning { background: var(--s-warn-50) !important; color: var(--s-warn) !important; border: 1px solid #fedf89; }
        .text-bg-info, .text-bg-primary { background: var(--s-brand-50) !important; color: var(--s-brand-600) !important; border: 1px solid #e0e7ff; }
        .alert { border-radius: 12px; border-width: 1px; font-size: .86rem; }
        .alert-info { background: var(--s-brand-50); border-color: #e0e7ff; color: #3730a3; }
        .alert-success { background: var(--s-ok-50); border-color: #abefc6; color: var(--s-ok); }
        .alert-warning { background: var(--s-warn-50); border-color: #fedf89; color: #93370d; }
        .alert-danger { background: var(--s-err-50); border-color: #fecdca; color: var(--s-err); }
        .alert-light { background: #fff; border-color: var(--s-line); color: var(--s-ink2); }
        code { color: #c11574; background: #fdf2fa; padding: 1px 5px; border-radius: 5px; font-size: .82em; }
        details > summary { cursor: pointer; }

        /* khối dùng chung cho trang Lương */
        .sal-head { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; margin: 14px 0 16px; }
        .sal-head h4 { margin: 0; }
        .sal-head p { margin: 4px 0 0; color: var(--s-muted); max-width: 80ch; }
        .sal-head .sp { flex: 1; }
        .sal-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
        .sal-kpi { background: #fff; border: 1px solid var(--s-line); border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
        .sal-kpi small { color: var(--s-muted); font-size: .76rem; font-weight: 600; }
        .sal-kpi b { color: var(--s-ink); font-size: 1.35rem; font-weight: 700; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
        .sal-kpi em { font-style: normal; color: var(--s-faint); font-size: .74rem; }
        .sal-kpi.net { background: linear-gradient(135deg, #312e81, #4f46e5); border-color: transparent; }
        .sal-kpi.net small, .sal-kpi.net em { color: #c7d2fe; } .sal-kpi.net b { color: #fff; }
        .sal-kpi.bad b { color: var(--s-err); } .sal-kpi.ok b { color: var(--s-ok); }
        @media (max-width: 720px) { .sal-kpis { grid-template-columns: 1fr 1fr; } .sal-kpi b { font-size: 1.1rem; } .sal-kpi.net { grid-column: 1 / -1; } }
        .sal-panel { background: #fff; border: 1px solid var(--s-line); border-radius: 14px; padding: 12px 14px; margin-bottom: 12px; }
        .sal-bar { position: sticky; bottom: 0; z-index: 20; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 14px;
                   background: rgba(255,255,255,.96); backdrop-filter: blur(8px); border: 1px solid var(--s-line); border-radius: 14px;
                   padding: 10px 14px; box-shadow: 0 -6px 20px rgba(16, 24, 40, .07); }
        .sal-bar .sp { flex: 1; }

        .mono { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .82rem; }
        textarea.mono { min-height: 110px; }
        .help-panel { position: sticky; top: 64px; max-height: calc(100vh - 80px); overflow-y: auto; font-size: .82rem; }
        .help-panel code { cursor: pointer; }
        .inherit { font-size: .76rem; color: var(--s-faint); }
        .row-custom { background: #fffaeb !important; }
        .card + .card { margin-top: 1rem; }
    </style>
</head>

<body>

<!-- ===== Thanh điều hướng: th:replace="~{salary/fragments :: nav('formula')}" =====
     Menu trái CHUNG (fragments/shell.html) + thanh tab của mục Lương. Đơn vị đang xem chọn ở menu trái. -->
<th:block th:fragment="nav(active)">
<th:block th:replace="~{fragments/shell :: nav(${active}, 'Lương')}"></th:block>
<th:block th:replace="~{fragments/shell :: script}"></th:block>
<nav class="navbar navbar-expand sal-tabs mb-3 py-0" aria-label="Mục lương">
    <div class="container-fluid">
        <ul class="navbar-nav flex-wrap">
            <li class="nav-item"><a class="nav-link" th:classappend="${active == 'config'} ? 'active'" th:href="@{/salary-config}"><span class="st">1</span>Cấu hình lương NV</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${active == 'formula'} ? 'active'" th:href="@{/salary-formula}"><span class="st">2</span>Mẫu công thức</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${active == 'monthly'} ? 'active'" th:href="@{/salary-monthly}"><span class="st">3</span>Khoản theo tháng</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${active == 'calc'} ? 'active'" th:href="@{/payroll/auto-calculate}"><span class="st">4</span>Tính lương tháng</a></li>
        </ul>
        <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link" th:classappend="${active == 'erp'} ? 'active'" th:href="@{/salary-erp}"><i class="fa-solid fa-plug"></i>Kết nối ERP</a></li>
            <li class="nav-item"><a class="nav-link" th:classappend="${active == 'audit'} ? 'active'" th:href="@{/salary-audit}"><i class="fa-solid fa-clock-rotate-left"></i>Nhật ký</a></li>
            <li class="nav-item d-none d-lg-block" th:if="${navUnitLabel != null}"><span class="unit" th:text="${navUnitLabel}">TH · Thanh Hóa Ford</span></li>
        </ul>
    </div>
</nav>
</th:block>

<!-- ===== Thông báo flash ===== -->
<div th:fragment="flash">
    <div th:if="${message}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${message}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${flashError}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${flashError}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ===== JS Bootstrap ===== -->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</th:block>

</body>
</html>
